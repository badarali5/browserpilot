<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · BrowserPilot Demo</title><link rel="stylesheet" href="/static/ui.css">
</head>
<body>
  <main class="bp-auth-layout">
    <section class="bp-auth-art">
      <div class="bp-auth-art-content"><span class="bp-eyebrow">BrowserPilot Demo</span><h1>Welcome back.</h1><p>Sign in to continue testing the profile experience and account workflows.</p></div>
    </section>
    <section class="bp-auth-panel">
      <div class="bp-auth-card">
        <h2>Log in</h2><p>Enter your account credentials.</p>
        {% if error %}<div class="bp-alert error" role="alert">{{ error }}</div>{% endif %}
        <form class="bp-form" method="POST" action="/login">
          <div class="bp-field"><label for="username">Username</label><input class="bp-input" id="username" name="username" autocomplete="username" required></div>
          <div class="bp-field"><label for="password">Password</label><input class="bp-input" id="password" name="password" type="password" autocomplete="current-password" required></div>
          <button class="bp-btn full" type="submit">Log in</button>
        </form>
        <p class="bp-auth-footer">New here? <a class="bp-link" href="/register">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
