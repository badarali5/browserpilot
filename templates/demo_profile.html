<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile · BrowserPilot Demo</title><link rel="stylesheet" href="/static/ui.css">
</head>
<body>
  <header class="bp-demo-header">
    <a class="bp-brand" href="/demo" style="margin:0"><span class="bp-brand-mark">BP</span><span>Profile</span></a>
    <nav class="bp-demo-links" aria-label="Profile navigation"><a href="/demo">Home</a><a href="/logout">Logout</a></nav>
  </header>
  <main class="bp-profile-layout">
    <section class="bp-card bp-profile-card">
      <aside class="bp-profile-aside">
        <div class="bp-avatar">{{ (user.display_name if user else 'G')[:1] | upper }}</div>
        <h2 style="margin:18px 0 4px">{{ user.display_name if user else 'Guest' }}</h2>
        <p style="margin:0;color:var(--bp-muted);font-size:13px">Account profile</p>
      </aside>
      <div class="bp-profile-main">
        <h2 style="margin:0 0 18px">Profile details</h2>
        <form class="bp-form" method="POST" action="/demo/profile">
          <div class="bp-field"><label for="display_name">Display name</label><input class="bp-input" id="display_name" name="display_name" value="{{ user.display_name if user else '' }}" required></div>
          <div class="bp-field"><label for="bio">Bio</label><textarea class="bp-textarea" id="bio" name="bio">{{ user.bio if user else '' }}</textarea></div>
          <button class="bp-btn" type="submit">Save changes</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
