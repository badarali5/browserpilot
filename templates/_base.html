<!doctype html>
<html lang="en" data-theme="dark" class="reduction-motion">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BrowserPilot - AI Browser Automation & Bug Injection Platform">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="{% block og_title %}BrowserPilot{% endblock %}">
    <meta property="og:description" content="{% block og_desc %}AI Browser Automation{% endblock %}">
    <meta property="og:image" content="{% block og_image %}/static/images/og-image.svg{% endblock %}">
    <meta property="og:url" content="{% block og_url %}http://127.0.0.1:8000{% endblock %}">
    <meta property="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}BrowserPilot{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_desc %}AI Browser Automation{% endblock %}">
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/latest"></script>
    <link rel="stylesheet" href="/static/ui.css">
    
    <!-- Alpine.js CDN -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.5/dist/htmx.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- JetBrains Mono for code blocks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --fg-primary: #f1f5f9;
            --fg-secondary: #94a3b8;
            --accent: #8b5cf6; /* electric violet */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --border-color: #475569;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --radius: 16px;
            --radius-sm: 12px;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Reduce motion */
        [data-reduce-motion] * {
            transition-duration: 0s !important;
            animation-duration: 0s !important;
            transition-timing-function: linear !important;
        }
        
        /* Glassmorphism */
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Gradient background */
        .bg-gradient-primary {
            background: linear-gradient(135deg, #0f172a 0, #1e293b 100%);
        }
        
        /* Accent gradient */
        .accent-gradient {
            background: linear-gradient(135deg, var(--accent), #a78bfa);
        }
        
        /* Noise overlay */
        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        /* Spotlight effect */
        .spotlight {
            position: relative;
        }
        
        .spotlight::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Toast container */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        /* Focus visible */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        /* Reduced motion media query */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0s !important;
                animation-duration: 0s !important;
            }
            .spotlight::after {
                animation: none;
            }
        }
        
        /* Scrollbar */
       ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
       ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
       ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
       ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
    
    {% block head_extras %}{% endblock %}
</head>
<body class="min-h-screen">
    <!-- Noise overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>
    
    <!-- Top bar -->
    <header class="bg-bg-secondary/80 border-b border-border-color/50 sticky top-0 z-50" style="background: rgba(15, 23, 42, 0.8) !important;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Topbar actions -->
                
            </div>
        </div>
    </header>
    
    <!-- Main content area -->
    <main id="main-content" class="pt-20 pb-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-bg-secondary/70 border-t border-border-color/50 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 text-sm text-fg-secondary">
                <span>BrowserPilot v{VERSION}</span>
                <span>100% free, no sign-up required</span>
            </div>
        </div>
    </footer>
    
    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    
<!-- Reduce motion preference switch -->
<script>
    if (window.location.hash === '#main-content') {
        history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    // Check for user preference
    const prefersReduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const storedPreference = localStorage.getItem('reduce-motion');
    
    if (storedPreference) {
        document.documentElement.dataset.reduceMotion = storedPreference;
    } else if (prefersReduceMotion) {
        document.documentElement.dataset.reduceMotion = 'true';
    }
    
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeSun = document.getElementById('theme-sun');
    const themeMoon = document.getElementById('theme-moon');
    
    // Check stored theme or system preference
    const storedTheme = localStorage.getItem('theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (storedTheme === 'light' || (!storedTheme && !systemDark)) {
        document.documentElement.classList.add('light');
        themeSun.classList.add('hidden');
        themeMoon.classList.remove('hidden');
    }
    
    themeToggle.addEventListener('click', () => {
        if (document.documentElement.classList.contains('light')) {
            document.documentElement.classList.remove('light');
            localStorage.setItem('theme', 'dark');
            themeSun.classList.add('hidden');
            themeMoon.classList.remove('hidden');
        } else {
            document.documentElement.classList.add('light');
            localStorage.setItem('theme', 'light');
            themeSun.classList.remove('hidden');
            themeMoon.classList.add('hidden');
        }
    });
    
    // Reduce motion toggle
    const reduceMotionToggle = document.getElementById('reduce-motion-toggle');
    const html = document.documentElement;
    
    if (localStorage.getItem('reduce-motion') === 'true') {
        html.dataset.reduceMotion = 'true';
    }
    
    reduceMotionToggle.addEventListener('click', () => {
        const shouldReduce = html.dataset.reduceMotion === 'true';
        html.dataset.reduceMotion = shouldReduce ? 'false' : 'true';
        localStorage.setItem('reduce-motion', html.dataset.reduceMotion);
    });
    
    // Initialize Lucide icons
    lucide.createIcons();
</script>
</body>
</html>
