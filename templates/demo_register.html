<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register · BrowserPilot Demo</title><link rel="stylesheet" href="/static/ui.css">
</head>
<body>
  <main class="bp-auth-layout">
    <section class="bp-auth-art">
      <div class="bp-auth-art-content"><span class="bp-eyebrow">BrowserPilot Demo</span><h1>Build a test account.</h1><p>Use this focused registration flow to verify validation, submission, and navigation behavior.</p></div>
    </section>
    <section class="bp-auth-panel">
      <div class="bp-auth-card">
        <h2>Create account</h2><p>Enter a few details to get started.</p>
        {% if error %}<div class="bp-alert error" role="alert">{{ error }}</div>{% endif %}
        <form class="bp-form" method="POST" action="/register">
          <div class="bp-field"><label for="username">Username</label><input class="bp-input" id="username" name="username" autocomplete="username" required></div>
          <div class="bp-field"><label for="email">Email</label><input class="bp-input" id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="bp-field"><label for="password">Password</label><input class="bp-input" id="password" name="password" type="password" minlength="6" autocomplete="new-password" required></div>
          <button class="bp-btn full" type="submit">Create account</button>
        </form>
        <p class="bp-auth-footer">Already registered? <a class="bp-link" href="/login">Log in</a></p>
      </div>
    </section>
  </main>
</body>
</html>
